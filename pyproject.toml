[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-xl2db"
version = "0.1.0"
description = "Convert spreadsheets (.xlsx, .csv) into one SQLite database that people and AI can query"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ai-xl2db = "ai_xl2db.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_xl2db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
